<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Settimanale - Camp / Centro Sportivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1380px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #89b4fa;
            margin-top: 0;
        }
        .section-label {
            font-size: 12px;
            font-weight: bold;
            color: #bac2de;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid-top {
            display: grid;
            grid-template-columns: 1.15fr 1.25fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 1000px) {
            .grid-top { grid-template-columns: 1fr; }
        }
        .card {
            background-color: #313244;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #45475a;
            color: white;
            font-size: 14px;
            flex: 1;
        }
        .box-group {
            background-color: #252636;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .hours-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-height: 145px;
            overflow-y: auto;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            cursor: pointer;
            user-select: none;
            background-color: #313244;
            padding: 5px 8px;
            border-radius: 5px;
        }
        .check-item input {
            accent-color: #89b4fa;
            width: 15px;
            height: 15px;
            cursor: pointer;
            margin: 0;
        }
        .check-item.day-off input {
            accent-color: #f38ba8;
        }
        .check-item.hour-ok input {
            accent-color: #a6e3a1;
        }
        .mini-link {
            font-size: 11px;
            color: #89b4fa;
            cursor: pointer;
            text-decoration: underline;
            text-transform: none;
            font-weight: normal;
        }
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #b4befe; }
        button.danger {
            background-color: #f38ba8;
            padding: 6px 10px;
            font-size: 12px;
        }
        button.warning {
            background-color: #fab387;
            padding: 6px 10px;
            font-size: 12px;
            color: #11111b;
        }
        button.secondary {
            background-color: #6c7086;
            color: white;
            display: none;
        }
        .form-actions {
            display: flex;
            gap: 10px;
        }
        button.generate {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background-color: #a6e3a1;
            margin-bottom: 15px;
        }
        button.generate:hover { background-color: #94e2d5; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        button.pdf-btn {
            background-color: #f38ba8;
            color: #11111b;
            padding: 12px 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button.pdf-btn:hover { background-color: #eba0ac; }
        
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 270px;
            overflow-y: auto;
        }
        li.person-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #45475a;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            gap: 10px;
        }
        .item-buttons {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }
        .badge {
            background-color: #89b4fa;
            color: #11111b;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.limit-day {
            background-color: #f38ba8;
            color: #11111b;
        }
        .badge.limit-hour {
            background-color: #f9e2af;
            color: #11111b;
        }

        /* Configurazione Fasce Orarie */
        .slot-config-list {
            max-height: 610px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .slot-row {
            background-color: #45475a;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slot-time {
            font-weight: bold;
            color: #f9e2af;
            font-size: 14px;
        }
        .slot-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .slot-roles label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: #313244;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .slot-roles input {
            accent-color: #a6e3a1;
            cursor: pointer;
        }

        /* Tabella Planning */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #313244;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #45475a;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #181825;
            color: #89b4fa;
            text-align: center;
            font-size: 15px;
        }
        .turno-label {
            font-weight: bold;
            color: #f9e2af;
            width: 130px;
            white-space: nowrap;
            background-color: #252636;
        }
        .person-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #45475a;
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 13px;
            border-left: 3px solid #a6e3a1;
        }
        .person-tag.unassigned {
            border-left-color: #f38ba8;
            background-color: rgba(243, 139, 168, 0.15);
            color: #f38ba8;
        }
        .role-pill {
            font-size: 11px;
            background-color: #181825;
            color: #cdd6f4;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Stampa / PDF */
        @media print {
            body { background-color: white; color: black; padding: 0; }
            .container { max-width: 100%; }
            .grid-top, button, .no-print { display: none !important; }
            h1 { color: black; text-align: center; font-size: 22px; margin-bottom: 10px; }
            table { background-color: white; border: 1px solid #ccc; }
            th { background-color: #f0f0f0 !important; color: black !important; border: 1px solid #ccc; }
            td { border: 1px solid #ccc; }
            .turno-label { background-color: #f8f9fa !important; color: black !important; }
            .person-tag { background-color: #f1f3f5 !important; color: black !important; border-left: 3px solid #40c057 !important; }
            .person-tag.unassigned { background-color: #fff5f5 !important; color: #fa5252 !important; border-left-color: #fa5252 !important; }
            .role-pill { background-color: #e9ecef !important; color: #495057 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Planning Settimanale (Lunedì - Venerdì)</h1>

    <div class="grid-top no-print">
        <!-- Sezione 1: Persone, Ruoli e Limiti -->
        <div class="card">
            <h2 id="titoloFormPersona">1. Staff, Ruoli e Limiti</h2>
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="form-row">
                <input type="text" id="nomePersona" placeholder="Nome (es. Paolo)">
            </div>

            <!-- Ruoli -->
            <div class="section-label">Ruoli abilitati</div>
            <div class="box-group roles-grid" id="nuovaPersonaRuoli"></div>

            <!-- Giorni di assenza -->
            <div class="section-label">
                <span>Giorni di assenza / riposo (spunta per escludere)</span>
            </div>
            <div class="box-group days-grid" id="nuovaPersonaGiorniNo"></div>

            <!-- Fasce orarie disponibili -->
            <div class="section-label">
                <span>Fasce orarie disponibili (togli la spunta per ferie/limiti)</span>
                <span>
                    <span class="mini-link" onclick="selezionaTutteOre(true)">Tutte</span> / 
                    <span class="mini-link" onclick="selezionaTutteOre(false)">Nessuna</span>
                </span>
            </div>
            <div class="box-group hours-grid" id="nuovaPersonaOreOk"></div>

            <div class="form-actions">
                <button id="btnSalvaPersona" onclick="salvaPersona()">+ Aggiungi Persona</button>
                <button id="btnAnnulla" class="secondary" onclick="annullaModifica()">Annulla</button>
            </div>

            <ul id="listaPersone" style="margin-top: 15px;"></ul>
        </div>

        <!-- Sezione 2: Configurazione Ruoli per Fascia Oraria -->
        <div class="card">
            <h2>2. Ruoli Richiesti per Fascia Oraria</h2>
            <div class="slot-config-list" id="configFasceOrarie"></div>
        </div>
    </div>

    <button class="generate no-print" onclick="generaPlanning()">⚡ Compila Planning Automaticamente</button>

    <!-- Barra azioni tabella -->
    <div class="action-bar no-print">
        <h2>Tabella Turni</h2>
        <button class="pdf-btn" onclick="esportaPDF()">📥 Salva come PDF / Stampa</button>
    </div>

    <!-- Tabella Planning -->
    <div class="table-wrapper" id="risultatoPlanning"></div>
</div>

<script>
    const RUOLI_DISPONIBILI = [
        "Check-In",
        "Gazebo",
        "Multisport",
        "Piscina",
        "Tennis/Padel",
        "Pranzo"
    ];

    const FASCE_ORARIE_FISSE = [
        "08:00 - 09:00",
        "09:00 - 10:00",
        "10:00 - 11:00",
        "11:00 - 12:00",
        "12:00 - 13:00",
        "13:00 - 14:00",
        "14:00 - 14:30",
        "14:30 - 15:30",
        "15:30 - 16:30",
        "16:30 - 17:30"
    ];

    const GIORNI = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì"];

    // Carica dati (mantiene compatibilità con eventuali dati già salvati nel browser)
    let persone = JSON.parse(localStorage.getItem('staff_v2')) || [
        { nome: "Paolo", ruoli: ["Check-In", "Tennis/Padel", "Pranzo"], giorniNo: [], fasceOk: [...FASCE_ORARIE_FISSE] },
        { nome: "Nicola", ruoli: ["Multisport", "Piscina", "Pranzo"], giorniNo: ["Mercoledì"], fasceOk: [...FASCE_ORARIE_FISSE] },
        { nome: "Giulia", ruoli: ["Gazebo", "Check-In", "Pranzo"], giorniNo: [], fasceOk: ["08:00 - 09:00", "09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00", "12:00 - 13:00", "13:00 - 14:00"] },
        { nome: "Marco", ruoli: ["Tennis/Padel", "Multisport", "Pranzo"], giorniNo: [], fasceOk: [...FASCE_ORARIE_FISSE] }
    ];

    // Normalizza i dati esistenti se mancavano i campi giorniNo / fasceOk
    persone = persone.map(p => ({
        nome: p.nome,
        ruoli: p.ruoli || [],
        giorniNo: p.giorniNo || [],
        fasceOk: p.fasceOk || [...FASCE_ORARIE_FISSE]
    }));

    let configOrari = JSON.parse(localStorage.getItem('orari_v2')) || {
        "08:00 - 09:00": ["Check-In", "Gazebo"],
        "09:00 - 10:00": ["Multisport", "Tennis/Padel"],
        "10:00 - 11:00": ["Multisport", "Piscina"],
        "11:00 - 12:00": ["Tennis/Padel", "Piscina"],
        "12:00 - 13:00": ["Gazebo", "Multisport"],
        "13:00 - 14:00": ["Gazebo"],
        "14:00 - 14:30": ["Pranzo"],
        "14:30 - 15:30": ["Multisport", "Tennis/Padel"],
        "15:30 - 16:30": ["Piscina", "Multisport"],
        "16:30 - 17:30": ["Gazebo", "Check-In"]
    };

    function salvaDati() {
        localStorage.setItem('staff_v2', JSON.stringify(persone));
        localStorage.setItem('orari_v2', JSON.stringify(configOrari));
    }

    function renderFormCheckboxes() {
        // Ruoli
        document.getElementById('nuovaPersonaRuoli').innerHTML = RUOLI_DISPONIBILI.map(ruolo => `
            <label class="check-item">
                <input type="checkbox" value="${ruolo}" class="cb-ruolo"> ${ruolo}
            </label>
        `).join('');

        // Giorni No
        document.getElementById('nuovaPersonaGiorniNo').innerHTML = GIORNI.map(giorno => `
            <label class="check-item day-off">
                <input type="checkbox" value="${giorno}" class="cb-giorno-no"> ${giorno.slice(0, 3)}
            </label>
        `).join('');

        // Fasce Orarie Disponibili (spuntate di default)
        document.getElementById('nuovaPersonaOreOk').innerHTML = FASCE_ORARIE_FISSE.map(fascia => `
            <label class="check-item hour-ok">
                <input type="checkbox" value="${fascia}" class="cb-ora-ok" checked> ${fascia}
            </label>
        `).join('');
    }

    function selezionaTutteOre(stato) {
        document.querySelectorAll('.cb-ora-ok').forEach(cb => cb.checked = stato);
    }

    function aggiornaListaPersone() {
        const ul = document.getElementById('listaPersone');
        ul.innerHTML = persone.map((p, index) => {
            const giorniNoHtml = (p.giorniNo && p.giorniNo.length > 0)
                ? `<span class="badge limit-day">Assente: ${p.giorniNo.map(g => g.slice(0,3)).join(', ')}</span>`
                : '';

            const oreLimitate = p.fasceOk && p.fasceOk.length < FASCE_ORARIE_FISSE.length;
            const oreHtml = oreLimitate
                ? `<span class="badge limit-hour">Disponibile ${p.fasceOk.length}/${FASCE_ORARIE_FISSE.length} fasce</span>`
                : '';

            return `
                <li class="person-item">
                    <div>
                        <strong>${p.nome}</strong>
                        <div class="badges-container">
                            ${p.ruoli.map(r => `<span class="badge">${r}</span>`).join('')}
                            ${giorniNoHtml}
                            ${oreHtml}
                        </div>
                    </div>
                    <div class="item-buttons">
                        <button class="warning" onclick="iniziaModifica(${index})">Modifica</button>
                        <button class="danger" onclick="rimuoviPersona(${index})">X</button>
                    </div>
                </li>
            `;
        }).join('');
    }

    function aggiornaConfigOrari() {
        const container = document.getElementById('configFasceOrarie');
        container.innerHTML = FASCE_ORARIE_FISSE.map(fascia => {
            const ruoliAttivi = configOrari[fascia] || [];
            const checkboxesHtml = RUOLI_DISPONIBILI.map(ruolo => {
                const checked = ruoliAttivi.includes(ruolo) ? 'checked' : '';
                return `
                    <label>
                        <input type="checkbox" ${checked} onchange="toggleRuoloOrario('${fascia}', '${ruolo}', this.checked)">
                        ${ruolo}
                    </label>
                `;
            }).join('');

            return `
                <div class="slot-row">
                    <div class="slot-time">🕒 ${fascia}</div>
                    <div class="slot-roles">${checkboxesHtml}</div>
                </div>
            `;
        }).join('');
    }

    function toggleRuoloOrario(fascia, ruolo, isChecked) {
        if (!configOrari[fascia]) configOrari[fascia] = [];
        if (isChecked) {
            if (!configOrari[fascia].includes(ruolo)) configOrari[fascia].push(ruolo);
        } else {
            configOrari[fascia] = configOrari[fascia].filter(r => r !== ruolo);
        }
        salvaDati();
    }

    function salvaPersona() {
        const nomeInput = document.getElementById('nomePersona');
        const nome = nomeInput.value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);
        
        const ruoliSelezionati = Array.from(document.querySelectorAll('.cb-ruolo:checked')).map(cb => cb.value);
        const giorniNoSelezionati = Array.from(document.querySelectorAll('.cb-giorno-no:checked')).map(cb => cb.value);
        const fasceOkSelezionate = Array.from(document.querySelectorAll('.cb-ora-ok:checked')).map(cb => cb.value);

        if (!nome) return alert("Inserisci il nome della persona!");
        if (ruoliSelezionati.length === 0) return alert("Seleziona almeno un ruolo!");
        if (fasceOkSelezionate.length === 0) return alert("Seleziona almeno una fascia oraria disponibile per " + nome + "!");

        const datiPersona = {
            nome,
            ruoli: ruoliSelezionati,
            giorniNo: giorniNoSelezionati,
            fasceOk: fasceOkSelezionate
        };

        if (editIndex === -1) {
            persone.push(datiPersona);
        } else {
            persone[editIndex] = datiPersona;
        }

        annullaModifica();
        salvaDati();
        aggiornaListaPersone();
    }

    function iniziaModifica(index) {
        const p = persone[index];
        document.getElementById('nomePersona').value = p.nome;
        document.getElementById('editIndex').value = index;
        document.getElementById('titoloFormPersona').innerText = "✏️ Modifica Staff e Limiti";
        document.getElementById('btnSalvaPersona').innerText = "Salva Modifiche";
        document.getElementById('btnAnnulla').style.display = "inline-block";

        document.querySelectorAll('.cb-ruolo').forEach(cb => {
            cb.checked = p.ruoli.includes(cb.value);
        });

        document.querySelectorAll('.cb-giorno-no').forEach(cb => {
            cb.checked = (p.giorniNo || []).includes(cb.value);
        });

        const oreDisponibili = p.fasceOk || FASCE_ORARIE_FISSE;
        document.querySelectorAll('.cb-ora-ok').forEach(cb => {
            cb.checked = oreDisponibili.includes(cb.value);
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function annullaModifica() {
        document.getElementById('nomePersona').value = '';
        document.getElementById('editIndex').value = "-1";
        document.getElementById('titoloFormPersona').innerText = "1. Staff, Ruoli e Limiti";
        document.getElementById('btnSalvaPersona').innerText = "+ Aggiungi Persona";
        document.getElementById('btnAnnulla').style.display = "none";
        
        document.querySelectorAll('.cb-ruolo').forEach(cb => cb.checked = false);
        document.querySelectorAll('.cb-giorno-no').forEach(cb => cb.checked = false);
        document.querySelectorAll('.cb-ora-ok').forEach(cb => cb.checked = true);
    }

    function rimuoviPersona(index) {
        persone.splice(index, 1);
        salvaDati();
        aggiornaListaPersone();
        if (parseInt(document.getElementById('editIndex').value) === index) {
            annullaModifica();
        }
    }

    function esportaPDF() {
        window.print();
    }

    function generaPlanning() {
        if (persone.length === 0) {
            return alert("Aggiungi almeno una persona nello staff prima di compilare!");
        }

        let conteggioTurni = {};
        persone.forEach(p => conteggioTurni[p.nome] = 0);

        let html = '<table><thead><tr><th>Fascia Oraria</th>';
        GIORNI.forEach(g => html += `<th>${g}</th>`);
        html += '</tr></thead><tbody>';

        FASCE_ORARIE_FISSE.forEach((fascia, fIndex) => {
            html += `<tr><td class="turno-label">${fascia}</td>`;
            const ruoliRichiesti = configOrari[fascia] || [];

            GIORNI.forEach((giorno, gIndex) => {
                if (ruoliRichiesti.length === 0) {
                    html += `<td style="color: #6c7086; text-align: center; font-size: 12px;"><em>Nessun ruolo</em></td>`;
                    return;
                }

                let occupatiInQuestaOra = new Set();
                let cellHtml = '';

                ruoliRichiesti.forEach(ruolo => {
                    // Filtra per:
                    // 1. Possiede il ruolo
                    // 2. Non è già occupato in questa ora
                    // 3. Non è assente in questo giorno della settimana
                    // 4. Ha questa fascia oraria tra quelle disponibili
                    let candidatiValidi = persone.filter(p => {
                        const haRuolo = p.ruoli.includes(ruolo);
                        const liberoOra = !occupatiInQuestaOra.has(p.nome);
                        const presenteGiorno = !(p.giorniNo || []).includes(giorno);
                        const disponibileFascia = (p.fasceOk || FASCE_ORARIE_FISSE).includes(fascia);
                        
                        return haRuolo && liberoOra && presenteGiorno && disponibileFascia;
                    });

                    if (candidatiValidi.length > 0) {
                        candidatiValidi.sort((a, b) => {
                            const diffTurni = conteggioTurni[a.nome] - conteggioTurni[b.nome];
                            if (diffTurni !== 0) return diffTurni;
                            return ((a.nome.length + gIndex + fIndex) % 3) - ((b.nome.length + gIndex + fIndex) % 3);
                        });

                        const scelto = candidatiValidi[0];
                        occupatiInQuestaOra.add(scelto.nome);
                        conteggioTurni[scelto.nome]++;

                        cellHtml += `
                            <div class="person-tag">
                                <strong>${scelto.nome}</strong>
                                <span class="role-pill">${ruolo}</span>
                            </div>
                        `;
                    } else {
                        cellHtml += `
                            <div class="person-tag unassigned">
                                <span>⚠️ Scoperto</span>
                                <span class="role-pill">${ruolo}</span>
                            </div>
                        `;
                    }
                });

                html += `<td>${cellHtml}</td>`;
            });

            html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('risultatoPlanning').innerHTML = html;
    }

    renderFormCheckboxes();
    aggiornaListaPersone();
    aggiornaConfigOrari();
    generaPlanning();
</script>

</body>
</html>
