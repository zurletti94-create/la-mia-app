<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Settimanale - Camp / Centro Sportivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #89b4fa;
            margin-top: 0;
        }
        .grid-top {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 950px) {
            .grid-top { grid-template-columns: 1fr; }
        }
        .card {
            background-color: #313244;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #45475a;
            color: white;
            font-size: 14px;
            flex: 1;
        }
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            background-color: #252636;
            padding: 10px;
            border-radius: 8px;
        }
        .role-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .role-checkbox input {
            accent-color: #89b4fa;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #b4befe; }
        button.danger {
            background-color: #f38ba8;
            padding: 4px 8px;
            font-size: 12px;
        }
        button.generate {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background-color: #a6e3a1;
            margin-bottom: 20px;
        }
        button.generate:hover { background-color: #94e2d5; }
        
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }
        li.person-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #45475a;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .badge {
            background-color: #89b4fa;
            color: #11111b;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Configurazione Fasce Orarie */
        .slot-config-list {
            max-height: 360px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .slot-row {
            background-color: #45475a;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slot-time {
            font-weight: bold;
            color: #f9e2af;
            font-size: 14px;
        }
        .slot-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .slot-roles label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: #313244;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .slot-roles input {
            accent-color: #a6e3a1;
            cursor: pointer;
        }

        /* Tabella Planning */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #313244;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #45475a;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #181825;
            color: #89b4fa;
            text-align: center;
            font-size: 15px;
        }
        .turno-label {
            font-weight: bold;
            color: #f9e2af;
            width: 130px;
            white-space: nowrap;
            background-color: #252636;
        }
        .person-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #45475a;
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 13px;
            border-left: 3px solid #a6e3a1;
        }
        .person-tag.unassigned {
            border-left-color: #f38ba8;
            background-color: rgba(243, 139, 168, 0.15);
            color: #f38ba8;
        }
        .role-pill {
            font-size: 11px;
            background-color: #181825;
            color: #cdd6f4;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Planning Settimanale (Lunedì - Venerdì)</h1>

    <div class="grid-top">
        <!-- Sezione 1: Persone e Ruoli Multipli -->
        <div class="card">
            <h2>1. Staff e Ruoli Abilitati</h2>
            <div class="form-row">
                <input type="text" id="nomePersona" placeholder="Nome (es. Paolo)">
                <button onclick="aggiungiPersona()">+ Aggiungi</button>
            </div>
            <div class="roles-grid" id="nuovaPersonaRuoli">
                <!-- Generato da JS -->
            </div>
            <ul id="listaPersone"></ul>
        </div>

        <!-- Sezione 2: Configurazione Ruoli per Fascia Oraria -->
        <div class="card">
            <h2>2. Ruoli Richiesti per Fascia Oraria</h2>
            <div class="slot-config-list" id="configFasceOrarie">
                <!-- Generato da JS -->
            </div>
        </div>
    </div>

    <button class="generate" onclick="generaPlanning()">⚡ Compila Planning Automaticamente</button>

    <!-- Tabella Planning -->
    <div class="table-wrapper" id="risultatoPlanning"></div>
</div>

<script>
    const RUOLI_DISPONIBILI = [
        "Check-In",
        "Gazebo",
        "Multisport",
        "Piscina",
        "Tennis/Padel",
        "Pranzo"
    ];

    const FASCE_ORARIE_FISSE = [
        "08:00 - 09:00",
        "09:00 - 10:00",
        "10:00 - 11:00",
        "11:00 - 12:00",
        "12:00 - 13:00",
        "13:00 - 14:00",
        "14:00 - 14:30",
        "14:30 - 15:30",
        "15:30 - 16:30",
        "16:30 - 17:30"
    ];

    const GIORNI = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì"];

    // Carica dati salvati o imposta esempi iniziali
    let persone = JSON.parse(localStorage.getItem('staff_v2')) || [
        { nome: "Paolo", ruoli: ["Check-In", "Tennis/Padel", "Pranzo"] },
        { nome: "Nicola", ruoli: ["Multisport", "Piscina", "Pranzo"] },
        { nome: "Giulia", ruoli: ["Gazebo", "Check-In", "Pranzo"] },
        { nome: "Marco", ruoli: ["Tennis/Padel", "Multisport", "Pranzo"] }
    ];

    // Configurazione ruoli richiesti per ogni fascia oraria
    let configOrari = JSON.parse(localStorage.getItem('orari_v2')) || {
        "08:00 - 09:00": ["Check-In", "Gazebo"],
        "09:00 - 10:00": ["Multisport", "Tennis/Padel"],
        "10:00 - 11:00": ["Multisport", "Piscina"],
        "11:00 - 12:00": ["Tennis/Padel", "Piscina"],
        "12:00 - 13:00": ["Gazebo", "Multisport"],
        "13:00 - 14:00": ["Gazebo"],
        "14:00 - 14:30": ["Pranzo"],
        "14:30 - 15:30": ["Multisport", "Tennis/Padel"],
        "15:30 - 16:30": ["Piscina", "Multisport"],
        "16:30 - 17:30": ["Gazebo", "Check-In"]
    };

    function salvaDati() {
        localStorage.setItem('staff_v2', JSON.stringify(persone));
        localStorage.setItem('orari_v2', JSON.stringify(configOrari));
    }

    // Inizializza le checkbox per l'aggiunta di una nuova persona
    function renderCheckboxesNuovaPersona() {
        const container = document.getElementById('nuovaPersonaRuoli');
        container.innerHTML = RUOLI_DISPONIBILI.map(ruolo => `
            <label class="role-checkbox">
                <input type="checkbox" value="${ruolo}"> ${ruolo}
            </label>
        `).join('');
    }

    // Renderizza l'elenco dello staff
    function aggiornaListaPersone() {
        const ul = document.getElementById('listaPersone');
        ul.innerHTML = persone.map((p, index) => `
            <li class="person-item">
                <div>
                    <strong>${p.nome}</strong>
                    <div class="badges-container">
                        ${p.ruoli.map(r => `<span class="badge">${r}</span>`).join('')}
                    </div>
                </div>
                <button class="danger" onclick="rimuoviPersona(${index})">X</button>
            </li>
        `).join('');
    }

    // Renderizza la configurazione delle 10 fasce orarie
    function aggiornaConfigOrari() {
        const container = document.getElementById('configFasceOrarie');
        container.innerHTML = FASCE_ORARIE_FISSE.map(fascia => {
            const ruoliAttivi = configOrari[fascia] || [];
            const checkboxesHtml = RUOLI_DISPONIBILI.map(ruolo => {
                const checked = ruoliAttivi.includes(ruolo) ? 'checked' : '';
                return `
                    <label>
                        <input type="checkbox" ${checked} onchange="toggleRuoloOrario('${fascia}', '${ruolo}', this.checked)">
                        ${ruolo}
                    </label>
                `;
            }).join('');

            return `
                <div class="slot-row">
                    <div class="slot-time">🕒 ${fascia}</div>
                    <div class="slot-roles">${checkboxesHtml}</div>
                </div>
            `;
        }).join('');
    }

    function toggleRuoloOrario(fascia, ruolo, isChecked) {
        if (!configOrari[fascia]) configOrari[fascia] = [];
        if (isChecked) {
            if (!configOrari[fascia].includes(ruolo)) configOrari[fascia].push(ruolo);
        } else {
            configOrari[fascia] = configOrari[fascia].filter(r => r !== ruolo);
        }
        salvaDati();
    }

    function aggiungiPersona() {
        const nomeInput = document.getElementById('nomePersona');
        const nome = nomeInput.value.trim();
        const checkboxes = document.querySelectorAll('#nuovaPersonaRuoli input:checked');
        const ruoliSelezionati = Array.from(checkboxes).map(cb => cb.value);

        if (!nome) return alert("Inserisci il nome della persona!");
        if (ruoliSelezionati.length === 0) return alert("Seleziona almeno un ruolo per " + nome + "!");

        persone.push({ nome, ruoli: ruoliSelezionati });
        nomeInput.value = '';
        checkboxes.forEach(cb => cb.checked = false);
        
        salvaDati();
        aggiornaListaPersone();
    }

    function rimuoviPersona(index) {
        persone.splice(index, 1);
        salvaDati();
        aggiornaListaPersone();
    }

    function generaPlanning() {
        if (persone.length === 0) {
            return alert("Aggiungi almeno una persona nello staff prima di compilare!");
        }

        // Contatore turni totali assegnati a ciascuna persona per bilanciare il carico
        let conteggioTurni = {};
        persone.forEach(p => conteggioTurni[p.nome] = 0);

        let html = '<table><thead><tr><th>Fascia Oraria</th>';
        GIORNI.forEach(g => html += `<th>${g}</th>`);
        html += '</tr></thead><tbody>';

        FASCE_ORARIE_FISSE.forEach((fascia, fIndex) => {
            html += `<tr><td class="turno-label">${fascia}</td>`;
            const ruoliRichiesti = configOrari[fascia] || [];

            GIORNI.forEach((giorno, gIndex) => {
                if (ruoliRichiesti.length === 0) {
                    html += `<td style="color: #6c7086; text-align: center; font-size: 12px;"><em>Nessun ruolo</em></td>`;
                    return;
                }

                // Traccia chi è già occupato in questa specifica ora e giorno
                let occupatiInQuestaOra = new Set();
                let cellHtml = '';

                ruoliRichiesti.forEach(ruolo => {
                    // Trova candidati che sanno fare il ruolo e sono liberi in quest'ora
                    let candidati = persone.filter(p => 
                        p.ruoli.includes(ruolo) && !occupatiInQuestaOra.has(p.nome)
                    );

                    if (candidati.length > 0) {
                        // Ordina per chi ha lavorato meno finora + leggera rotazione giornaliera
                        candidati.sort((a, b) => {
                            const diffTurni = conteggioTurni[a.nome] - conteggioTurni[b.nome];
                            if (diffTurni !== 0) return diffTurni;
                            return ((a.nome.length + gIndex + fIndex) % 3) - ((b.nome.length + gIndex + fIndex) % 3);
                        });

                        const scelto = candidati[0];
                        occupatiInQuestaOra.add(scelto.nome);
                        conteggioTurni[scelto.nome]++;

                        cellHtml += `
                            <div class="person-tag">
                                <strong>${scelto.nome}</strong>
                                <span class="role-pill">${ruolo}</span>
                            </div>
                        `;
                    } else {
                        cellHtml += `
                            <div class="person-tag unassigned">
                                <span>⚠️ Scoperto</span>
                                <span class="role-pill">${ruolo}</span>
                            </div>
                        `;
                    }
                });

                html += `<td>${cellHtml}</td>`;
            });

            html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('risultatoPlanning').innerHTML = html;
    }

    // Avvio iniziale
    renderCheckboxesNuovaPersona();
    aggiornaListaPersone();
    aggiornaConfigOrari();
    generaPlanning();
</script>

</body>
</html>
